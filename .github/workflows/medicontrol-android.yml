name: MediControl Android verification

on:
  push:
    branches: [dot/medicontrol-android-verification]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: medicontrol-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    name: Analyze, test and open MediControl on Android 15
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: medicontrol
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up matching Flutter SDK
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: false

      - name: Analyze and run existing tests
        run: |
          set -euo pipefail
          mkdir -p evidence
          flutter --version | tee evidence/flutter-version.txt
          flutter pub get
          flutter analyze 2>&1 | tee evidence/analyze.log
          flutter test --reporter expanded 2>&1 | tee evidence/unit-widget.log

      - name: Build normal debug APK
        run: flutter build apk --debug

      - name: Enable accelerated emulator on disposable runner
        working-directory: .
        run: |
          printf '%s\n' 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android launch and end-to-end verification
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          emulator-boot-timeout: 600
          disable-animations: true
          disable-spellchecker: true
          enable-hw-keyboard: false
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
            -camera-back none -camera-front none
          script: cd medicontrol && bash scripts/verify-android.sh

      - name: Upload minimal verification evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: medicontrol-android-${{ github.run_number }}
          retention-days: 3
          if-no-files-found: warn
          path: medicontrol/evidence/

      - name: Write verification summary
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          {
            echo '### MediControl Android verification'
            echo "- Result: $RESULT"
            echo '- Android 15 / API 35, x86_64, accelerated disposable emulator.'
            echo '- Original debug APK launch, analyzer, unit/widget suite and UI integration checks.'
            echo '- Only bundled demonstration data and explicitly fictitious CI records.'
            echo '- Evidence: screenshots and bounded logs; no APK or database uploaded; retention 3 days.'
            echo '- No real device, release signing, backend, notification or medical validation.'
          } >> "$GITHUB_STEP_SUMMARY"
